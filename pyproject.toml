[project]
name = "grad-research"
version = "0.1.0"
description = "Research scripts and notes for AT/CD-CAT experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = false
